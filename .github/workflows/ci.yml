name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The end-to-end test walks the planted fixture in test/fixtures, so a
    # keyboard defect the plugin stops catching fails here rather than in a
    # user's workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
